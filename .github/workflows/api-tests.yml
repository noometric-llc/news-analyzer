name: API Integration Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug logging'
        required: false
        default: 'false'
        type: boolean
  workflow_call:
    # Allows this workflow to be called from other workflows (e.g., deploy-production.yml)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  JAVA_VERSION: '17'
  DB_URL: jdbc:postgresql://localhost:5432/newsanalyzer_test
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  BACKEND_URL: http://localhost:8080

jobs:
  api-tests:
    name: Run API Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: newsanalyzer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ==================== Checkout ====================
      - name: Checkout code
        uses: actions/checkout@v4

      # ==================== Setup Java ====================
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # ==================== Cache Maven Dependencies ====================
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ==================== Build Backend ====================
      - name: Build Backend
        working-directory: ./backend
        run: |
          echo "Building Java backend..."
          mvn clean package -DskipTests -q
        env:
          MAVEN_OPTS: -Xmx1024m

      # ==================== Start Backend Service ====================
      - name: Start Backend Service
        working-directory: ./backend
        run: |
          echo "Starting Java backend on port 8080..."
          java -jar target/*.jar \
            --spring.profiles.active=test \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/newsanalyzer_test \
            --spring.datasource.username=postgres \
            --spring.datasource.password=postgres \
            --server.port=8080 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          echo "Backend starting in background (PID: $(cat /tmp/backend.pid))..."

      # ==================== Wait for Services ====================
      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be ready..."

          echo "Checking Backend health..."
          for i in {1..60}; do
            if curl -s http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✓ Backend is healthy"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "✗ Backend failed to start within 2 minutes"
              echo "========== BACKEND LOGS =========="
              cat /tmp/backend.log || echo "No backend log file"
              echo "========== END BACKEND LOGS =========="
              exit 1
            fi
            echo "  Attempt $i/60 - Backend not ready, waiting..."
            sleep 2
          done

          echo "All services are healthy!"

      # ==================== Run API Tests ====================
      - name: Run API Integration Tests
        id: api-tests
        working-directory: ./api-tests
        run: |
          echo "Running API Integration Tests..."
          START_TIME=$(date +%s)

          mvn test -Pci \
            -Ddb.url=jdbc:postgresql://localhost:5432/newsanalyzer_test \
            -Ddb.username=postgres \
            -Ddb.password=postgres \
            -Dbackend.baseUrl=http://localhost:8080

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "test_duration=$DURATION" >> $GITHUB_OUTPUT
          echo "Tests completed in ${DURATION} seconds"
        env:
          DB_URL: jdbc:postgresql://localhost:5432/newsanalyzer_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          BACKEND_URL: http://localhost:8080
          REASONING_URL: http://localhost:8000

      # ==================== Upload Test Results ====================
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            api-tests/target/surefire-reports/
            api-tests/target/site/jacoco/
          retention-days: 14

      # ==================== Publish Test Summary ====================
      - name: Publish Test Summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'api-tests/target/surefire-reports/TEST-*.xml'
          summary: true
          detailed_summary: true
          include_passed: true

      # ==================== Add Job Summary ====================
      - name: Add Job Summary
        if: always()
        run: |
          echo "## API Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Duration | ${{ steps.api-tests.outputs.test_duration || 'N/A' }} seconds |" >> $GITHUB_STEP_SUMMARY
          echo "| Java Version | ${{ env.JAVA_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PostgreSQL | 15 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Tested" >> $GITHUB_STEP_SUMMARY
          echo "- Backend API (Spring Boot): \`http://localhost:8080\`" >> $GITHUB_STEP_SUMMARY
          echo "- Database (PostgreSQL): \`localhost:5432\`" >> $GITHUB_STEP_SUMMARY
