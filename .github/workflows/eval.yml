name: Evaluation Harness

on:
  push:
    branches: [main]
    paths:
      - 'eval/**'
  pull_request:
    branches: [main]
    paths:
      - 'eval/**'

# NOTE: scorer-tests and extractor-tests jobs were removed in INFRA-1.3.
# The reasoning service (and its eval tests) moved to noometric-intelligence.
# This workflow now validates only the gold dataset and eval artifacts
# that live in this public repo.

jobs:
  gold-dataset-validation:
    name: Gold Dataset Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate gold dataset
        run: python eval/datasets/scripts/validate_gold.py
