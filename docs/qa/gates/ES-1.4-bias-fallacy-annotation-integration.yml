    notes: "biasDetectionStatus=FAILED reliably means the annotation batch didn't persist, now proven for both HTTP-layer failures (RestClientException) and persistence-layer failures (generic RuntimeException standing in for DataIntegrityViolationException) after this review's added test"
  maintainability:
