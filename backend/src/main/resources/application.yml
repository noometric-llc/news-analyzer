spring:
  application:
    name: newsanalyzer-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

# Default configuration (overridden by profile-specific configs)
server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Reasoning service (noometric-intelligence, private repo).
# Defined here (not application-dev.yml) so it loads regardless of active
# Spring profile — see TD-002 in docs/TECHNICAL-DEBT.md for why that matters:
# application-prod.yml doesn't exist yet, so profile-specific config is
# silently skipped in production.
reasoning-service:
  base-url: ${REASONING_SERVICE_URL:http://localhost:8000}
  api-key: ${NOOMETRIC_API_KEY:}
  timeout: 30000
  bias-timeout: 60000
